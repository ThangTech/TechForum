# nginx đứng trước cả hệ thống: trả các file của trang React, và chuyển /api, /media sang container API.
# Nhờ vậy trình duyệt chỉ thấy một địa chỉ: không cần CORS, cookie làm mới phiên hoạt động đơn giản.
server {
    listen 80;
    server_name _;

    # Video tải lên tối đa 50 MB (Media:MaxVideoBytes); để dư một chút.
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # DNS nội bộ của Docker. Tên "api" được tra lúc có yêu cầu (không phải lúc nginx khởi động), nên nginx vẫn chạy
    # được khi API chưa sẵn sàng; API lên sau là dùng được ngay.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Gọi API và file media lưu tại chỗ: chuyển nguyên đường dẫn sang API.
    location /api/ {
        proxy_pass $api_upstream;
        # Cho API biết địa chỉ thật của người dùng và giao thức gốc (backend đọc khi ReverseProxy:Enabled=true).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # sitemap.xml cho Google do API tạo từ các bài công khai.
    location = /sitemap.xml {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File JS/CSS đã có mã băm trong tên (Vite đặt), nên được giữ lâu trong bộ nhớ đệm của trình duyệt.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mọi địa chỉ khác (/articles, /topics/...) là trang của React Router: trả index.html để React tự xử lý.
    # index.html không được giữ trong bộ nhớ đệm, để bản build mới có hiệu lực ngay.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
