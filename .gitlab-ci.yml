stages:
  - build
  - test

build_frontend:
  stage: build
  image: node:20
  script:
    - cd frontend 
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

build_backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd backend
    - dotnet restore
    - dotnet build --configuration Release --no-restore
    - dotnet publish -c Release -o out --no-build
  artifacts:
    paths:
      - backend/out/
    expire_in: 1 hour
test_frontend:
  stage: test
  image: node:20
  needs: ["build_frontend"] 
  script:
    - cd frontend
    - npm install
    - npm run test -- --passWithNoTests 

test_backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  needs: ["build_backend"]
  script:
    - cd backend
    - dotnet test --no-restore --verbosity normal