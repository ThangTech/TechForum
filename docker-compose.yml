# Chạy cả TechForum bằng Docker: SQL Server, API (ASP.NET Core) và trang web (nginx).
#
#   1. Chép .env.example thành .env rồi điền mật khẩu DB và khoá JWT (xem hướng dẫn trong file).
#   2. docker compose up -d --build        (build image từ mã nguồn rồi chạy)
#   3. Mở http://localhost:8088             (hoặc cổng WEB_PORT trong .env)
#
# Dừng: docker compose down. Thêm -v để xoá luôn dữ liệu (DB, ảnh tải lên, khoá) và bắt đầu lại từ đầu.
# Biến ${...} lấy từ file .env cùng thư mục; ${TEN:-mặc định} dùng giá trị mặc định khi .env không có.

name: techforum

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong file .env}
    volumes:
      # Dữ liệu SQL Server nằm trong volume, nên còn nguyên khi container bị xoá và tạo lại.
      - db-data:/var/opt/mssql
    ports:
      # Chỉ mở cho chính máy này (127.0.0.1), để xem DB bằng SSMS/Azure Data Studio: Server=127.0.0.1,14333; User=sa (dùng 127.0.0.1, "localhost" trên Windows có thể thử IPv6 trước và bị treo).
      - "127.0.0.1:${DB_PORT:-14333}:1433"
    healthcheck:
      # "Khoẻ" khi đăng nhập được và mọi database đã ONLINE. Ngay sau khi khởi động, SQL Server còn phục hồi database
      # TechForum vài giây; nếu API chạy lúc đó, nó tưởng database chưa có, thử tạo mới và dừng vì lỗi 1801.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -o /dev/null -Q \"IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE') THROW 50000, 'recovering', 1\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    # Có cả image và build: "docker compose up --build" build từ mã nguồn và đặt tên image này;
    # "docker compose pull" tải bản đã build sẵn từ GitHub Container Registry (bước CD).
    image: ghcr.io/thangtech/techforum-api:${IMAGE_TAG:-latest}
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Không in từng câu SQL vào log (chỉ in khi có cảnh báo hoặc lỗi), để log dễ đọc.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TechForum;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Hãy đặt JWT_SIGNING_KEY trong file .env}
      # Các cờ ở bước 2: tự migrate và thêm dữ liệu mẫu, giữ khoá trong volume, đọc IP thật từ nginx.
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: ${SEED_DEMO_DATA:-true}
      ReverseProxy__Enabled: "true"
      BannedWords__SeedFile: /app/Data/Seed/banned-words.txt
      # Tải ảnh/video lên Cloudinary. Để trống thì trang vẫn chạy nhưng không tải được tệp.
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      # Kiểm duyệt ảnh bằng AI khi tải lên (aws_rek), cần đăng ký add-on trên Cloudinary. Để trống thì không kiểm duyệt.
      Cloudinary__ImageModeration: ${CLOUDINARY_IMAGE_MODERATION:-}
      # Gửi email (xác minh tài khoản, quên mật khẩu). Để trống SMTP_HOST thì mọi email đi vào Mailpit (hộp thư giả,
      # xem ở http://localhost:8025); điền SMTP thật (ví dụ Mailjet) trong .env để gửi ra ngoài.
      RecoveryEmail__Host: ${SMTP_HOST:-mailpit}
      RecoveryEmail__Port: ${SMTP_PORT:-1025}
      RecoveryEmail__UseTls: ${SMTP_USE_TLS:-false}
      RecoveryEmail__Username: ${SMTP_USERNAME:-}
      RecoveryEmail__Password: ${SMTP_PASSWORD:-}
      RecoveryEmail__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@techforum.local}
      RecoveryEmail__FrontendUrl: ${PUBLIC_URL:-http://localhost:8088}
      # Đăng nhập bằng Google: cùng Client ID với nút ở trang web. Để trống thì tắt.
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - uploads:/app/App_Data/uploads
      # Danh sách từ cấm: mặc định là file mẫu trong repo; đặt BANNED_WORDS_FILE để dùng danh sách thật trên máy.
      - ${BANNED_WORDS_FILE:-./backend/Data/Seed/banned-words.example.txt}:/app/Data/Seed/banned-words.txt:ro
    # Không mở cổng ra ngoài: chỉ nginx (service web) gọi được API, qua mạng nội bộ của Docker.
    restart: unless-stopped

  # Hộp thư giả cho máy phát triển: giữ lại mọi email API gửi đi, không gửi ra Internet.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  web:
    image: ghcr.io/thangtech/techforum-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /
        VITE_FROALA_KEY: ${VITE_FROALA_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
